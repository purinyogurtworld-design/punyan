<script>
/* 疑似横画面: iPhoneのSafariは向きを固定できないので、縦持ちのまま画面を90度回して横画面にする。
   Godotには「横長のウィンドウ」に見せ(innerWidth/innerHeightを入れ替え)、キャンバスをCSSで回し、タッチ座標を逆回転して渡す。 */
(function () {
  var dW = Object.getOwnPropertyDescriptor(window, 'innerWidth'), dH = Object.getOwnPropertyDescriptor(window, 'innerHeight');
  if (!dW || !dH || !dW.get || !dH.get) return;
  var gw = dW.get.bind(window), gh = dH.get.bind(window);
  var rot = false;
  var stableH = gh();      // キーボードが出る前の画面の高さ(回したときの『横幅』になる。キーボードで縮めない)
  try { rot = localStorage.getItem('tc_rot') === '1'; } catch (e) {}
  // 画面の拡大縮小を止める(回したキャンバスが画面より広くなっても、ページ全体が縮んで広がらないように)
  function lockZoom() {
    try {
      var m = document.querySelector('meta[name=viewport]');
      if (!m) { m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
      m.content = 'width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
    } catch (e) {}
  }
  lockZoom();
  // 端末の画面の長い辺(CSSピクセル)。回したときの『横幅』の上限にする(ページが広がっても、これより大きくしない)
  function longSide() {
    var a = 0;
    try { a = Math.max(screen.width || 0, screen.height || 0); } catch (e) {}
    return a > 0 ? a : Math.max(gw(), gh());
  }
  var st = document.createElement('style');
  function css() {
    var W = gw();
    st.textContent = rot ? 'html,body{overflow:hidden!important;overscroll-behavior:none!important;width:100%!important;height:100%!important;margin:0!important;}' +
      '#canvas{position:fixed!important;left:0!important;top:0!important;transform-origin:0 0!important;transform:translateX(' + W + 'px) rotate(90deg)!important;}' : '';
  }
  document.head.appendChild(st);
  function rotW() { return Math.min(Math.max(gh(), stableH), longSide()); }
  Object.defineProperty(window, 'innerWidth', { configurable: true, get: function () { return rot ? rotW() : gw(); } });
  Object.defineProperty(window, 'innerHeight', { configurable: true, get: function () { return rot ? gw() : gh(); } });
  function save() { try { localStorage.setItem('tc_rot', rot ? '1' : '0'); } catch (e) {} }
  function fire() { css(); setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 0); setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 250); }
  window.tcRotate = function (on) { rot = !!on; save(); fire(); };
  window.tcInfo = function () { if (rot) return 'rot'; return gw() < gh() ? 'port' : 'land'; };
  // 本体を実際に横向きにしたときだけ、疑似横画面をやめる(キーボードが出て画面が低くなっただけでは、やめない)
  function devLandscape() {
    try { if (screen.orientation && screen.orientation.type) return screen.orientation.type.indexOf('landscape') === 0; } catch (e) {}
    return typeof window.orientation === 'number' && Math.abs(window.orientation) === 90;
  }
  var wasLand = devLandscape();
  function onTurn() {
    if (gh() > stableH) stableH = Math.min(gh(), longSide());
    var l = devLandscape();
    if (rot && l && !wasLand) { rot = false; save(); }
    wasLand = l;
    css();
  }
  window.addEventListener('orientationchange', function () { setTimeout(function () { stableH = gh(); onTurn(); }, 300); }, true);
  window.addEventListener('resize', onTurn, true);
  css();
  // Godotはキャンバスの位置・大きさ(getBoundingClientRect)を使って座標を換算する。回っているあいだは、回す前の長方形を教える
  var gbr = Element.prototype.getBoundingClientRect;
  Element.prototype.getBoundingClientRect = function () {
    var r = gbr.call(this);
    if (rot && this && this.id === 'canvas') {
      try { return new DOMRect(0, 0, rotW(), gw()); } catch (e) { return r; }
    }
    return r;
  };
  // 座標を、回す前のキャンバスの座標に直す
  function mapXY(X, Y) { var W = gw(); return [Y, W - X]; }      // 回す前のキャンバス(CSSの大きさ = 画面の縦×横を入れ替えたもの)の座標
  function mapD(dX, dY) { return [dY, -dX]; }
  function patch(o, proto) {
    var gx = Object.getOwnPropertyDescriptor(proto, 'clientX'), gy = Object.getOwnPropertyDescriptor(proto, 'clientY');
    if (!gx || !gy) return;
    var fx = gx.get, fy = gy.get;
    var defs = {};
    ['clientX', 'pageX', 'screenX', 'offsetX', 'x'].forEach(function (k) {
      var d = Object.getOwnPropertyDescriptor(proto, k); if (d && d.get) defs[k] = d.get;
    });
    ['clientY', 'pageY', 'screenY', 'offsetY', 'y'].forEach(function (k) {
      var d = Object.getOwnPropertyDescriptor(proto, k); if (d && d.get) defs[k] = d.get;
    });
    Object.keys(defs).forEach(function (k) {
      var isX = /X$|^x$/.test(k), g = defs[k];
      Object.defineProperty(o, k, { configurable: true, get: function () {
        if (!rot) return g.call(o);
        var m = mapXY(fx.call(o), fy.call(o));
        return isX ? m[0] : m[1];
      } });
    });
  }
  function patchMove(e) {
    var gx = Object.getOwnPropertyDescriptor(MouseEvent.prototype, 'movementX'), gy = Object.getOwnPropertyDescriptor(MouseEvent.prototype, 'movementY');
    if (!gx || !gy) return;
    Object.defineProperty(e, 'movementX', { configurable: true, get: function () { return rot ? mapD(gx.get.call(e), gy.get.call(e))[0] : gx.get.call(e); } });
    Object.defineProperty(e, 'movementY', { configurable: true, get: function () { return rot ? mapD(gx.get.call(e), gy.get.call(e))[1] : gy.get.call(e); } });
  }
  var mouseTypes = ['mousedown', 'mouseup', 'mousemove', 'click', 'dblclick', 'contextmenu', 'wheel', 'pointerdown', 'pointerup', 'pointermove', 'pointercancel', 'pointerover', 'pointerout', 'pointerenter', 'pointerleave'];
  mouseTypes.forEach(function (t) {
    window.addEventListener(t, function (e) {
      if (!rot) return;
      patch(e, MouseEvent.prototype);
      patchMove(e);
    }, true);
  });
  // タッチ: イベントの途中でTouchの実体が作り直されるので、個々のTouchではなく、Touch全体の読み取りを差しかえる
  try {
    var tp = Touch.prototype;
    var tgx = Object.getOwnPropertyDescriptor(tp, 'clientX').get, tgy = Object.getOwnPropertyDescriptor(tp, 'clientY').get;
    [['clientX', 0], ['pageX', 0], ['screenX', 0], ['clientY', 1], ['pageY', 1], ['screenY', 1]].forEach(function (kv) {
      var d = Object.getOwnPropertyDescriptor(tp, kv[0]);
      if (!d || !d.get) return;
      var orig = d.get, idx = kv[1];
      Object.defineProperty(tp, kv[0], { configurable: true, enumerable: d.enumerable, get: function () {
        if (!rot) return orig.call(this);
        var m = mapXY(tgx.call(this), tgy.call(this));
        return m[idx];
      } });
    });
  } catch (e) {}
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"tc10172328","experimentalVK":true,"fileSizes":{"tc10172328.pck":62247280,"tc10172328.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
